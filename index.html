<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Comisión CAPSTONE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: barra superior fija con evaluación y rol; a la izquierda la lista de equipos; a la derecha la mesa de trabajo del equipo en pestañas. */
:root{
  --bg:#f5f4fa; --surface:#ffffff; --surface2:#efedf7; --line:#dbd7ea; --fg:#1c1930; --muted:#615c7a;
  --accent:#3c3489; --accent-fg:#ffffff; --accent-soft:#e7e4f6;
  --ok:#1c7a4b; --ok-soft:#dff3e8; --info:#285fa8; --info-soft:#e0ebf9; --warn:#96560a; --warn-soft:#fbeed6; --bad:#b3261e; --bad-soft:#fbe3e1;
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131120; --surface:#1c192d; --surface2:#262239; --line:#3a3456; --fg:#ece9f8; --muted:#a8a2c4;
  --accent:#ada3f5; --accent-fg:#15122a; --accent-soft:#2f2a52;
  --ok:#62d39a; --ok-soft:#173527; --info:#8ab8f5; --info-soft:#18293f; --warn:#f0b65e; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#41191a;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131120; --surface:#1c192d; --surface2:#262239; --line:#3a3456; --fg:#ece9f8; --muted:#a8a2c4;
  --accent:#ada3f5; --accent-fg:#15122a; --accent-soft:#2f2a52;
  --ok:#62d39a; --ok-soft:#173527; --info:#8ab8f5; --info-soft:#18293f; --warn:#f0b65e; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#41191a;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.grow{flex:1 1 auto}
.field{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.45}
textarea.fb{min-height:54px}
.sync{font-size:12px;color:var(--muted);min-width:86px;text-align:right}
[hidden]{display:none!important}
body{margin:0}
/* tres columnas con desplazamiento propio: equipos | expediente + en vivo | rúbrica */
.wrap{padding-block:12px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:var(--lw,clamp(210px,18vw,264px)) minmax(0,1fr) var(--rw,clamp(340px,32vw,480px));gap:14px;align-items:stretch;height:calc(100dvh - var(--top,58px) - env(safe-area-inset-top,0px));min-height:440px}
.wrap.side-min{--lw:60px}
.wrap.rub-min{--rw:40px}
.wrap.rub-wide{--rw:min(48vw,820px)}
.side{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
#main{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden;padding-bottom:12px}
#center{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.tabpane{flex:1 1 auto;min-height:0;overflow:auto}
#tab-trabajo{display:grid;grid-template-rows:minmax(0,var(--split,46%)) 10px minmax(0,1fr);overflow:hidden}
#tab-trabajo.exp-min{grid-template-rows:auto 8px minmax(0,1fr)}
#tab-trabajo.vivo-min{grid-template-rows:minmax(0,1fr) 8px auto}
.exp-min #pane-exp .pane-b,.vivo-min #pane-vivo .pane-b,.exp-min #exTabs{display:none}
.exp-min .splitter,.vivo-min .splitter{visibility:hidden}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.pane-h{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pane-h h2,.col-h h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pane-b{flex:1 1 auto;min-height:0;overflow:auto;padding:12px;container-type:inline-size}
.splitter{cursor:row-resize;display:grid;place-items:center;touch-action:none}
.splitter::after{content:"";width:46px;height:4px;border-radius:2px;background:var(--line)}
.splitter:hover::after{background:var(--accent)}
.seg.sm button{padding:3px 10px;font-size:12.5px}
.rubcol{min-height:0;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.strip{width:100%;height:100%;min-height:200px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500;padding:10px 0;display:flex;justify-content:center}
.strip span{writing-mode:vertical-rl;white-space:nowrap}
.strip:hover{border-color:var(--accent);color:var(--fg)}
.rub-min #rubhead{flex:1 1 auto}
.colbtn{padding:2px 8px!important;font-size:15px!important;line-height:1.2}
.team-btn.mini{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:0;padding:6px 2px}
.team-btn.mini .sub{font-size:10.5px}
.team-btn.mini .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:2px}
.qhead{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start}
.qn{font-family:var(--display);font-weight:600;color:var(--muted);padding-top:3px;text-align:right}
textarea.qtext{field-sizing:content;min-height:0;resize:none;font-weight:500;border-color:transparent;background:transparent;padding:2px 6px;line-height:1.4}
textarea.qtext:hover:not(:disabled),textarea.qtext:focus{border-color:var(--line);background:var(--surface)}
textarea.qtext:disabled{color:inherit;opacity:1}
/* lector: barra fija con búsqueda, índice al costado */
.doc-bar{position:sticky;top:-12px;z-index:2;background:var(--surface);margin:-14px -16px 0;padding:8px 16px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.doc{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.doc.notoc{grid-template-columns:minmax(0,1fr)}
.doc-toc{position:sticky;top:44px;max-height:min(60vh,420px);overflow:auto;display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--line);padding-right:8px}
.doc-toc button{border:0;background:transparent;text-align:left;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--accent);font-size:12.5px;line-height:1.35}
.doc-toc button:hover{background:var(--surface2)}
.doc-toc .l2{padding-left:16px}.doc-toc .l3{padding-left:26px;color:var(--muted)}
mark.cur{background:var(--accent);color:var(--accent-fg);outline-color:var(--accent)}
@container (max-width:700px){.doc{grid-template-columns:minmax(0,1fr)}.doc-toc{position:static;max-height:130px;border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px}}
.sec-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.team-list{display:flex;flex-direction:column;gap:2px}
.team-btn{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;cursor:pointer}
.team-btn:hover{background:var(--surface2)}
.team-btn[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.team-btn .num{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.team-btn .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-btn .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.prog{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding:1px 7px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.prog.done{background:var(--ok-soft);color:var(--ok)}
.mobile-pick{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:start}
.head h1{font-size:20px;letter-spacing:-.015em}
#head.pad{padding:10px 14px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-top:6px}
.meta b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface2);border-radius:999px;padding:2px 9px;font-size:12px}
.timer{display:flex;align-items:center;gap:8px;padding-bottom:3px}
.clock{font-family:var(--display);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.warn{color:var(--warn)} .clock.over{color:var(--bad)}
.timer .lbl{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.rec{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabrow{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 12px;border-bottom:1px solid var(--line);margin:0 0 10px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.hd-t{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:2px}
.hd-t .chips{margin-top:0}
.vgrid{display:grid;gap:12px;align-items:start;grid-template-columns:minmax(0,1fr)}
@container (min-width:520px){.vgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .vgrid #notes{grid-column:1;grid-row:1} .vgrid #ai{grid-column:1;grid-row:2} .vgrid #qa{grid-column:2;grid-row:1 / span 2}}
@container (min-width:980px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))} .vgrid #notes,.vgrid #qa,.vgrid #ai{grid-row:1} .vgrid #qa{grid-column:2} .vgrid #ai{grid-column:3}}
#head h1{font-size:20px}
#tab-expediente{font-size:var(--fs,13px)}
#tab-expediente .pad{padding:10px 12px}
#tab-expediente h2{font-size:1.08em}
#tab-expediente .hint,#tab-expediente .kv,#tab-expediente th{font-size:.92em}
#tab-expediente table.doc th,#tab-expediente table.doc td,#tab-expediente .def .dt,#tab-expediente .files,#tab-expediente .tree{font-size:.95em}
#tab-expediente th,#tab-expediente td{padding:5px 8px}
#tab-expediente .reader{font-size:1em;line-height:1.55}
#tab-expediente .reader h3{font-size:1.25em;margin:18px 0 6px;padding-top:10px}
#tab-expediente .reader h4{font-size:1.12em;margin:14px 0 4px}
#tab-expediente .reader h5{font-size:1em;margin:12px 0 4px}
#tab-expediente .reader p{margin:0 0 7px}
#tab-expediente .def .dt{padding:5px 10px}
#tab-expediente .def .dd,#tab-expediente .def.one{padding:6px 10px}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.slides.big{grid-template-columns:minmax(0,1fr)}
.sl{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.sl img{display:block;width:100%;height:auto;cursor:zoom-in}
.slides.big .sl img{cursor:zoom-out}
.sl figcaption{font-size:11.5px;color:var(--muted);padding:2px 8px;text-align:right}
.top-in{max-width:none!important;padding-block:6px!important;gap:6px 12px!important}
#seatSel{max-width:210px}
.seg button{padding:5px 11px}
.hd-min{display:flex;flex-wrap:nowrap;gap:2px 12px;align-items:baseline}
.hd-min>*{flex:none}
.hd-min .hint{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-min h1{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-min h1{font-size:17px!important}
.hd-min .btn{margin-left:auto}
#head.pad{padding:8px 14px!important}
@media (max-height:800px){.brand small{display:none} .wrap{padding-top:8px;gap:10px} #main{gap:8px} .tabrow{margin-bottom:8px} .pane-b{padding:10px}}
.doc.toc-off{grid-template-columns:minmax(0,1fr)}
.doc.toc-off .doc-toc{display:none}
#pane-exp .pane-h h2{display:none}
.exp-min #pane-exp .pane-h h2{display:block}
.pane-h{flex-wrap:nowrap!important}
.seg.sm{flex-wrap:nowrap;overflow-x:auto;border-radius:10px;min-width:0}
.seg.sm button{white-space:nowrap}
.pane-h .row{flex-wrap:nowrap;flex:none}
.tabs button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:15px}
.hint{color:var(--muted);font-size:12.5px}
.partial{color:var(--muted);font-style:italic;min-height:1.4em;font-size:13px}
.others{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.other b{font-weight:600}
.other p{margin:2px 0 0;white-space:pre-wrap;color:var(--muted)}
.out{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:12px 14px;min-height:64px;overflow-wrap:anywhere}
.out h4{font-size:14px;margin:12px 0 4px}.out h4:first-child{margin-top:0}
.out p{margin:0 0 8px}.out ul,.out ol{margin:0 0 8px;padding-left:20px}.out li{margin:2px 0}
.msg{border-radius:8px;padding:8px 12px;margin:0 0 8px}.msg.me{background:var(--accent-soft)}.msg.ai{background:var(--surface2)}
.qcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.qcard .q{font-weight:500}
.tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);margin-right:4px;white-space:nowrap}
.ind{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.ind:first-of-type{border-top:0}
.ind-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.ind-t .w{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:12.5px;min-width:42px}
.lv button:disabled{cursor:not-allowed;opacity:.75}
.lv button[aria-pressed="true"][data-l="CL"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.lv button[aria-pressed="true"][data-l="L"]{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.lv button[aria-pressed="true"][data-l="LI"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lv button[aria-pressed="true"][data-l="NL"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr);gap:8px 12px;align-items:center}
.mblock{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.desc{font-size:12.5px;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details .dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:6px;font-size:12.5px}
.sug{background:var(--accent-soft);border-radius:8px;padding:7px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.scorebar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.big{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right}
.nota{font-family:var(--display);font-weight:600}
.nota.red{color:var(--bad)} .nota.blue{color:var(--info)}
pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border-radius:8px;padding:10px 12px;margin:6px 0 0;max-height:420px;overflow:auto}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted);padding:26px 8px;text-align:center}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
/* lector de documentos */
.reader{max-width:80ch;font-size:15px;line-height:1.65;overflow-wrap:anywhere;min-width:0}
.reader h3,.reader h4,.reader h5{scroll-margin-top:52px}
.reader h3{font-size:19px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.reader h3:first-child{margin-top:0;border-top:0;padding-top:0}
.reader h4{font-size:16px;margin:20px 0 6px}
.reader h5{font-size:14px;margin:16px 0 4px}
.reader p{margin:0 0 10px}
.reader ul{margin:0 0 10px;padding-left:22px}
.defs{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.def{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.def .dt{background:var(--surface2);padding:7px 12px;font-weight:600;font-size:13px}
.def .dd,.def.one{padding:9px 12px}
table.doc{margin:8px 0 14px}
table.doc th,table.doc td{border:1px solid var(--line);font-size:13.5px}
table.doc th{background:var(--surface2);text-transform:none;letter-spacing:0;color:var(--fg);font-weight:600}
mark{background:var(--warn-soft);color:var(--fg);border-radius:3px;padding:0 2px;outline:1px solid var(--warn)}
.toc{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;margin-top:6px}
.toc button{border:0;background:transparent;text-align:left;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--accent);font-size:13px}
.toc button:hover{background:var(--surface2)}
.toc .l2{padding-left:18px}.toc .l3{padding-left:30px;color:var(--muted)}
.slide{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.slide .num{font-family:var(--display);font-weight:600;color:var(--muted)}
.slide p{margin:2px 0 0;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.tree{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:1px;max-height:380px;overflow:auto}
.files{margin:0;padding-left:18px;font-size:13px;max-height:380px;overflow:auto}
@media (max-width:1100px){ .wrap{display:block;height:auto;min-height:0;padding-bottom:40px} .side{display:none} .mobile-pick{display:block} #main{overflow:visible} .tabpane{overflow:visible} #tab-trabajo{display:flex;flex-direction:column;gap:12px;overflow:visible} .pane{overflow:visible} .pane-b{overflow:visible} .splitter{display:none} .rubcol{overflow:visible;margin-top:14px} .strip{min-height:0;height:auto;padding:10px} .strip span{writing-mode:horizontal-tb} .doc-bar{position:static} .doc-toc{position:static} .head{grid-template-columns:minmax(0,1fr)} .timer{text-align:left} .timer .row{justify-content:flex-start!important} .scorebar{position:static} .kv{grid-template-columns:minmax(0,1fr)} .mrow{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- versión web: entrada y ventanas ---- */
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.gate-card h1{font-family:var(--display);font-size:24px;line-height:1.15;margin:0;letter-spacing:-.01em}
.gate-card .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gate-card p{margin:0}
.gate-card code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.gate-busy{color:var(--muted)}
#gateBody{display:flex;flex-direction:column;gap:12px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(15,12,35,.55);display:grid;place-items:start center;padding:5vh 16px;overflow:auto}
.modal-card{width:min(680px,100%);gap:18px!important}
.modal-card h2{margin:0}
.modal-card textarea{width:100%;font-family:var(--body);font-size:13.5px}
.modal-card #manualPrompt{font-family:var(--mono);font-size:12px;margin-top:8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px}
.steps li>.row,.steps li>textarea,.steps li>details{margin-top:8px}
.steps a.btn{text-decoration:none}
.acc-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.acc-row input{width:100%}
@media (max-width:640px){.acc-row{grid-template-columns:minmax(0,1fr)}}
body.web.eng-manual label.field:has(#tier),body.web.eng-mixed label.field:has(#tier),body.web.eng-local label.field:has(#tier){display:none}

/* ---- bandeja y avisos ---- */
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:600;line-height:18px;text-align:center;vertical-align:middle}
#inbBtn.has{border-color:var(--bad)}
.inbox{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:40;overflow:auto;border-radius:0!important;border-width:0 0 0 1px!important;box-shadow:-8px 0 30px rgba(15,12,35,.18)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:45;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 32px))}
.toast{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(15,12,35,.22);display:flex;flex-direction:column;gap:6px}
.toast .tt{font-weight:600}
.toast .tx{font-size:13.5px;overflow-wrap:anywhere}
.qcard.isnew{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.team-btn .badge{margin-left:6px}
</style>
</head>

<div id="gate"><div class="gate-card">
  <div><div class="eyebrow">PTY4614 · Duoc UC Valparaíso</div><h1>Comisión CAPSTONE</h1></div>
  <div id="gateBody"><p class="gate-busy">Cargando…</p></div>
</div></div>
<div id="app" hidden>
<header class="top"><div class="top-in">
  <div class="brand">Comisión CAPSTONE<small>PTY4614 · Duoc UC Valparaíso</small></div>
  <div class="seg" role="group" aria-label="Evaluación" id="evSeg"></div>
  <span class="grow"></span>
  <label class="field">Evalúo como <select id="seatSel"></select></label>
  <button class="btn sm" id="inbBtn" data-act="inbtoggle">Bandeja</button>
  <span class="sync" id="sync" aria-live="polite"></span>
</div></header>

<div class="wrap" id="wrap">
  <aside class="side" id="side" aria-label="Equipos"></aside>
  <main id="main">
    <div class="mobile-pick"><label class="field">Equipo <select id="teamSel"></select></label></div>
    <div id="banner"></div>
    <section class="card pad" id="head"></section>
    <div id="center">
      <div class="tabrow"><div class="tabs" role="tablist" id="tabs"></div>
        <div class="timer" title="Tiempo de presentación: máximo 20:00"><span class="clock" id="clock">20:00</span><button class="btn primary sm" data-act="tgo" id="tgo">Iniciar</button><button class="btn sm" data-act="treset" title="Reiniciar el cronómetro" aria-label="Reiniciar el cronómetro">↺</button></div></div>
      <div id="tab-trabajo" class="tabpane">
        <section class="pane" id="pane-exp" aria-label="Expediente">
          <div class="pane-h"><h2>Expediente</h2><div class="seg sm" id="exTabs" role="group" aria-label="Sección del expediente"></div>
            <span class="row"><button class="btn sm ghost" data-act="fs" data-v="-1" title="Letra más pequeña en el expediente" aria-label="Letra más pequeña">A−</button><button class="btn sm ghost" data-act="fs" data-v="1" title="Letra más grande en el expediente" aria-label="Letra más grande">A+</button><button class="btn sm ghost" data-act="panemax" data-v="exp" id="expMax">Ampliar</button><button class="btn sm ghost" data-act="panemin" data-v="exp" id="expMin">Ocultar</button></span></div>
          <div class="pane-b stack" id="tab-expediente"></div>
        </section>
        <div class="splitter" id="split" title="Arrastra para repartir el espacio entre el expediente y el trabajo en vivo"></div>
        <section class="pane" id="pane-vivo" aria-label="En vivo">
          <div class="pane-h"><h2>En vivo</h2>
            <span class="row"><button class="btn sm ghost" data-act="panemax" data-v="vivo" id="vivoMax">Ampliar</button><button class="btn sm ghost" data-act="panemin" data-v="vivo" id="vivoMin">Ocultar</button></span></div>
          <div class="pane-b" id="tab-vivo"><div class="vgrid">
            <section class="card pad stack" id="notes"></section>
            <section class="card pad stack" id="qa"></section>
            <section class="card pad stack" id="ai"></section>
          </div></div>
        </section>
      </div>
      <div id="tab-pauta" class="tabpane stack" hidden></div>
      <div id="tab-curso" class="tabpane stack" hidden></div>
    </div>
  </main>
  <aside class="rubcol" id="rubcol" aria-label="Rúbrica y cierre"><div id="rubhead"></div><div id="tab-rubrica" class="stack"></div></aside>
</div>
</div>
<aside id="inbox" class="inbox card pad stack" hidden aria-label="Bandeja de la comisión"></aside>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
